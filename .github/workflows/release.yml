name: Release
# Runs on every push to main. If manifest.json's "version" has no release yet (tag v<version>),
# it builds and publishes one, so releasing = bump "version" in manifest.json and merge.
#   embedyourmusic-edge.zip     Edge (and other Chromium browsers): unzip, then Load unpacked
#   embedyourmusic-chromium.zip Chrome, Brave, Opera, Vivaldi, Arc (same build as the Edge zip)
#   embedyourmusic-firefox.zip  Firefox (unsigned; temporary add-on, or sign with web-ext)
#   embedyourmusic-edge-store.zip  same build without the pinned key, for uploading to Edge Add-ons
#   embedyourmusic.user.js      Safari on iOS (Userscripts app); auto-updates via @updateURL
# If the Edge Add-ons secrets are set, the same build is also submitted to the Edge Add-ons store
# (which auto-updates installed copies).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: ver
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Test
        if: steps.ver.outputs.new == 'true'
        run: |
          npm ci
          npm test
        env:
          EYM_NO_REAL: "1"
      - name: Build
        if: steps.ver.outputs.new == 'true'
        run: |
          export EYM_VERSION="${{ steps.ver.outputs.version }}"
          node build.js
          mkdir -p out
          (cd dist/chromium && zip -qr ../../out/embedyourmusic-edge.zip .)
          (cd dist/chromium && zip -qr ../../out/embedyourmusic-chromium.zip .)
          (cd dist/firefox && zip -qr ../../out/embedyourmusic-firefox.zip .)
          (cd dist/edge-store && zip -qr ../../out/embedyourmusic-edge-store.zip .)
          cp dist/userscript/embedyourmusic.user.js out/
      - name: Create GitHub release
        if: steps.ver.outputs.new == 'true'
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            out/embedyourmusic-edge.zip \
            out/embedyourmusic-chromium.zip \
            out/embedyourmusic-firefox.zip \
            out/embedyourmusic-edge-store.zip \
            out/embedyourmusic.user.js \
            --target "$GITHUB_SHA" --title "v${{ steps.ver.outputs.version }}" --generate-notes
      - name: Submit to Edge Add-ons
        if: steps.ver.outputs.new == 'true' && env.EDGE_PRODUCT_ID != '' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != ''
        run: |
          API=https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions
          AUTH=(-H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")
          curl -fsS -D - -o /dev/null -X POST "${AUTH[@]}" -H "Content-Type: application/zip" \
            --data-binary @out/embedyourmusic-edge-store.zip "$API/draft/package"
          sleep 20
          curl -fsS -D - -o /dev/null -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
            -d "{\"notes\":\"v${{ steps.ver.outputs.version }}\"}" "$API"
