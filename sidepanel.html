<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmbedYourMusic player</title>
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main id="player">
    <p id="empty">Nothing playing. Open a release on rateyourmusic.com and click a streaming icon (or an album cover on the recommendations page) to play it here, or pick from the lists below.</p>
    <section id="now" hidden>
      <div id="tabs"></div>
      <div id="body"></div>
      <div id="rate-box">
        <div id="rating" role="group" aria-label="Your rating"></div>
        <div id="rating-note"></div>
      </div>
    </section>
    <section id="lists">
      <div class="acc" data-kind="similar"><button type="button" class="acc-head">Similar</button><div class="acc-body" hidden></div></div>
      <div class="acc" data-kind="recommended"><button type="button" class="acc-head">Recommended</button><div class="acc-body" hidden></div></div>
      <div class="acc" data-kind="challenge"><button type="button" class="acc-head">Challenge</button><div class="acc-body" hidden></div></div>
      <div class="acc" data-kind="favorites"><button type="button" class="acc-head">Favorites</button><div class="acc-body" hidden></div></div>
      <div class="acc" data-kind="history"><button type="button" class="acc-head">History</button><div class="acc-body" hidden></div></div>
    </section>
  </main>
  <script src="content.js"></script>
  <script src="spengine.js"></script>
  <script src="spplayer.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
